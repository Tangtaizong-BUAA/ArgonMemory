name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node scripts/search-smoke.mjs
      - run: npm run benchmark:check
      - run: python3 benchmarks/longmemeval_v2/smoke_test.py
      - run: NPM_CONFIG_CACHE=/tmp/argon-memory-npm-cache npm pack --dry-run
